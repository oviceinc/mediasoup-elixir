name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 40
    name: Build and test
    # actions/setup-python has no Python 3.11.5 (.tool-versions) for the ubuntu-latest (26.04) image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-python@v6
        with:
          python-version-file: .tool-versions
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
            deps
            _build
          key: ${{ runner.os }}-rust-${{ matrix.rust }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ matrix.rust }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run check formatted on elixir
        run: mix format --check-formatted
      - name: start epmd daemon for cluster tests
        run: epmd -daemon
      - name: Run tests with coverage
        run: mix coveralls.github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Leak check test
        run: mix test --include leakcheck

  lint:
    timeout-minutes: 40
    name: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
            deps
            _build
          key: ${{ runner.os }}-rust-${{ matrix.rust }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ matrix.rust }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatted on rust
        run: cargo fmt --check
        working-directory: native/mediasoup_elixir
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: native/mediasoup_elixir
      - name: Run dialyzer
        run: mix dialyzer
      - name: generate docs
        run: mix docs
      - name: credo
        run: mix credo
